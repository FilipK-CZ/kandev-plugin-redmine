# kandev plugin manifest for the Redmine connector.
#
# `id` MUST match the Go module name in go.mod and the id passed to
# window.registerKandevPlugin(...) in ui/bundle.js — it is also the prefix of
# every route kandev serves for this plugin (/api/plugins/<id>/...).
id: "kandev-plugin-redmine"
api_version: 1
version: "0.6.0"
display_name: "Redmine"
description: "Connect a Redmine instance: link kandev tasks to Redmine issues, sync status both ways, and watch for new issues."
author: "yattdev"
categories: ["connector"]
repo_url: "https://github.com/FilipK-CZ/kandev-plugin-redmine"

# First upstream release carrying the provider-neutral task
# priority/workflow-step contract from kdlbs/kandev#2872. Verified against
# the kandev history: merge commit 5f5b1f0 (2026-09-06) is an ancestor of
# the v0.94.0 tag but not of v0.93.0.
min_kandev_version: "0.94.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Least privilege: only the capabilities this plugin actually exercises.
#   state    - connection metadata, sync cursor, health state, echo-suppression
#              bookkeeping, watch dedup/throttle state (all scoped "workspace"
#              or "task" per key, never global).
#   secrets  - the workspace-composed, encrypted Redmine API key
#              (redmine.<workspace_id>.api_key — dots, not colons; the host's
#              secret-key pattern rejects colons). No config_schema secret
#              field is used: the API key is workspace-scoped, not
#              plugin-install-scoped.
#   api_read: ["tasks", "workflows"] - tasks: reading the linked task's current
#              state during sync/write-back. workflows: the field-mapping UI
#              lists the connection's target workflow's steps
#              (Workflows().List/.ListSteps) so mappings, tracker import routes,
#              and communication steps pick real workspace-owned step IDs.
#              messages: drafting and preview discovery. sessions/interactions:
#              read-only completion checks before opt-in automatic publication.
#   api_write: ["tasks"] - creating watcher tasks and updating already-linked
#              tasks during sync/write-back. Task linking itself is
#              plugin-owned state (Tasks().Update has no metadata field to
#              write a link onto an existing task — see
#              docs/plans/redmine-plugin/task-06-task-linking-bidirectional-sync.md
#              "Plan deviations"), matching the kandev-plugin-bitbucket precedent.
#   events: ["task.moved"] - near-real-time outbound write-back: when a linked
#              task moves to a workflow step with a status mapping and
#              autoStatusWriteback is enabled, OnEvent pushes the mapped
#              status immediately rather than waiting for the next sync poll.
#              This corrects task 01's original "no events capability"
#              design decision — the spec's write-back scenario ("within one
#              event-loop turn") is only achievable with it. The sync poll is
#              inbound only; it does not recreate a missed outbound event.
capabilities:
  state: true
  secrets: true
  api_read: ["tasks", "workflows", "messages", "sessions", "interactions"]
  api_write: ["tasks", "messages"]
  events: ["task.moved", "task.deleted", "workspace.deleted"]

# actions: the plugin's own native settings UI calls these via
# host.api.invokeAction (never host.api.fetch, which cannot reach them). Every
# action re-derives its plugin_state/secret keys from the host-verified
# VerifiedActionContext.WorkspaceID/TaskID, never from a request-body-supplied
# one (spec "Connection, permissions, and secrets").
actions:
  - { key: "connection.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "connection.save", scope: "workspace", max_body_bytes: 8192 }
  - { key: "connection.disconnect", scope: "workspace", max_body_bytes: 8192 }
  - { key: "integration.enabled.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "integration.enabled.save", scope: "workspace", max_body_bytes: 8192 }
  - { key: "projects.list", scope: "workspace", max_body_bytes: 8192 }
  - { key: "projects.save", scope: "workspace", max_body_bytes: 32768 }
  - { key: "workflows.list", scope: "workspace", max_body_bytes: 8192 }
  - { key: "fieldmapping.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "fieldmapping.save", scope: "workspace", max_body_bytes: 65536 }
  - { key: "syncoptions.save", scope: "workspace", max_body_bytes: 8192 }
  - { key: "syncoptions.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "issues.create", scope: "workspace", max_body_bytes: 65536 }
  - { key: "issues.update", scope: "workspace", max_body_bytes: 65536 }
  - { key: "issues.upload", scope: "workspace", max_body_bytes: 1048576 }
  - { key: "comments.get", scope: "task", max_body_bytes: 8192 }
  - { key: "comments.prepare", scope: "task", max_body_bytes: 65536 }
  - { key: "comments.approve", scope: "task", max_body_bytes: 8192 }
  - { key: "comments.reconcile", scope: "task", max_body_bytes: 8192 }
  - { key: "comments.discard", scope: "task", max_body_bytes: 8192 }
  - { key: "replies.settings.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "replies.settings.save", scope: "workspace", max_body_bytes: 8192 }
  - { key: "replies.request", scope: "task", max_body_bytes: 8192 }
  - { key: "link.get", scope: "task", max_body_bytes: 8192 }
  - { key: "link.set", scope: "task", max_body_bytes: 8192 }
  - { key: "link.unset", scope: "task", max_body_bytes: 8192 }
  - { key: "link.set_status", scope: "task", max_body_bytes: 8192 }
  - { key: "watches.list", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.filter_options", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.create", scope: "workspace", max_body_bytes: 32768 }
  - { key: "watches.update", scope: "workspace", max_body_bytes: 32768 }
  - { key: "watches.delete", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.poll", scope: "workspace", max_body_bytes: 8192 }

# reference_sources: composer `#` mentions resolve Redmine issues through
# SearchEntityReferences/AuthorizeEntityReference (backend, task 06/08) with
# submit-time reauthorization. No repository_providers: Redmine is an issue
# tracker, not a git host.
reference_sources:
  - source: "redmine-issues"
    provider: "redmine"
    kind: "issue"
    display_name: "Redmine issues"
    kind_label: "Issue"
    order: 40

ui:
  bundle: "/ui/bundle.js"
