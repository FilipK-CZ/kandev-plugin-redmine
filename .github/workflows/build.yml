name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The SDK contract released in kdlbs/kandev v0.94.0 (the first upstream
# release carrying the provider-neutral Task.Update contract from
# kdlbs/kandev#2872).
env:
  KANDEV_SDK_REPOSITORY: kdlbs/kandev
  KANDEV_SDK_REF: v0.94.0

jobs:
  package:
    name: Build plugin packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin

      - name: Check out kandev SDK contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ env.KANDEV_SDK_REPOSITORY }}
          path: kandev
          ref: ${{ env.KANDEV_SDK_REF }}
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Build host binary
        working-directory: plugin
        run: make build

      - name: Package and validate all supported platforms
        working-directory: plugin
        run: |
          base_version="$(sed -n 's/^version: "\([0-9.]*\)"$/\1/p' manifest.yaml)"
          test -n "$base_version"
          package_version="${base_version}+ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          sed -i "s/^version: .*/version: \"${package_version}\"/" manifest.yaml
          make verify-package VERSION="$package_version"
          sha256sum kandev-plugin-redmine-*.tar.gz > SHA256SUMS

      - name: Upload installable plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kandev-plugin-redmine
          if-no-files-found: error
          path: |
            plugin/kandev-plugin-redmine-*.tar.gz
            plugin/SHA256SUMS
